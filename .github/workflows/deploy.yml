name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  # Only superseded PR checks are cancelled; an interrupted deployment could leave a half-applied migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # dev deploys to staging; main and v* tags deploy to production.
  IS_STAGING: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: abregi_test
          POSTGRES_USER: abregi
          POSTGRES_PASSWORD: abregi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abregi -d abregi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://abregi:abregi@localhost:5432/abregi_test?schema=public
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      DISABLE_ERD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run test:swagger-ui

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ env.IS_STAGING == 'true' }}
            type=raw,value=latest,enable=${{ env.IS_STAGING != 'true' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      url: ${{ github.ref == 'refs/heads/dev' && 'https://staging.abregi.com' || 'https://www.abregi.com' }}

    steps:
      - uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ env.IS_STAGING == 'true' && 'gwertable-staging' || 'gwertable' }}
          IMAGE_TAG: ${{ env.IS_STAGING == 'true' && 'staging' || 'latest' }}
          BACKUP_BEFORE_MIGRATE: ${{ env.IS_STAGING != 'true' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DIR,IMAGE_TAG,BACKUP_BEFORE_MIGRATE
          timeout: 120s
          command_timeout: 15m
          script: |
            set -eu
            cd ~/"$DEPLOY_DIR"
            upsert_env() {
              key="$1"
              value="$2"
              touch .env
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env() {
              key="$1"
              value="$2"
              touch .env
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            upsert_env BACKEND_IMAGE "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
            ensure_env FRONTEND_IMAGE "${{ env.REGISTRY }}/${{ github.repository_owner }}/gwertable-frontend:$IMAGE_TAG"

            # Keep this compose file identical in gwertable-backend and gwertable-frontend:
            # each deployment rewrites it and recreates both services.
            cat > docker-compose.yml <<'COMPOSE'
            services:
              db:
                image: postgres:17
                restart: unless-stopped
                volumes:
                  - pgdata:/var/lib/postgresql/data
                environment:
                  POSTGRES_DB: gwertable
                  POSTGRES_USER: gwertable
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U gwertable"]
                  interval: 5s
                  timeout: 3s
                  retries: 10

              mailhog:
                image: mailhog/mailhog:v1.0.1
                restart: unless-stopped
                ports:
                  - "127.0.0.1:${MAILHOG_PORT:-8025}:8025"

              backend:
                image: ${BACKEND_IMAGE}
                restart: unless-stopped
                depends_on:
                  db:
                    condition: service_healthy
                  mailhog:
                    condition: service_started
                environment:
                  NODE_ENV: production
                  DATABASE_URL: postgresql://gwertable:${POSTGRES_PASSWORD}@db:5432/gwertable
                  PORT: 4000
                  HOST: 0.0.0.0
                  CORS_ORIGIN: ${FRONTEND_URL:-https://www.abregi.com}
                  FRONTEND_URL: ${FRONTEND_URL:-https://www.abregi.com}
                  DOCUMENT_AI_PROVIDER: ${DOCUMENT_AI_PROVIDER:-ollama}
                  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
                  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
                  OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
                  OLLAMA_MODEL: "${OLLAMA_MODEL:-llava}"
                  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
                  ASSISTANT_MODEL: "${ASSISTANT_MODEL:-claude-opus-5-5}"
                  ASSISTANT_EFFORT: "${ASSISTANT_EFFORT:-medium}"
                  ASSISTANT_MAX_STEPS: "${ASSISTANT_MAX_STEPS:-20}"
                  AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-15}
                  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
                  MAIL_TRANSPORT: smtp
                  MAIL_FROM: "${MAIL_FROM:-Abregi <no-reply@abregi.local>}"
                  SMTP_HOST: "${SMTP_HOST:-mailhog}"
                  SMTP_PORT: "${SMTP_PORT:-1025}"
                  SMTP_SECURE: "${SMTP_SECURE:-false}"
                  SMTP_USER: "${SMTP_USER:-}"
                  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
                expose:
                  - "4000"
                volumes:
                  - uploads:/app/uploads

              frontend:
                image: ${FRONTEND_IMAGE}
                restart: unless-stopped
                depends_on:
                  - backend
                environment:
                  NODE_ENV: production
                  BACKEND_API_URL: http://backend:4000
                  NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
                  # Production shares the session between abregi.com and www.abregi.com.
                  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.abregi.com}
                ports:
                  - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

            volumes:
              pgdata:
              uploads:
            COMPOSE

            retry() {
              for attempt in 1 2 3 4 5; do
                "$@" && return 0
                status=$?
                if [ "$attempt" = "5" ]; then
                  return "$status"
                fi
                sleep $((attempt * 10))
              done
            }

            docker compose up -d db mailhog
            retry docker compose pull backend frontend
            if [ "$BACKUP_BEFORE_MIGRATE" = "true" ]; then
              mkdir -p ~/backups
              dump=~/backups/predeploy-$(date +%Y%m%d-%H%M%S).sql
              docker compose exec -T db pg_dump -U gwertable gwertable > "$dump"
              gzip "$dump"
              find ~/backups -name 'predeploy-*.sql.gz' -mtime +14 -delete
            fi
            docker compose run --rm backend npx prisma migrate deploy
            for attempt in 1 2 3; do
              if docker compose up -d --force-recreate --remove-orphans backend frontend; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              docker compose ps -a
              sleep 15
            done
            docker image prune -f
