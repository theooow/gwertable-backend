name: Build & Deploy

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gwertable_test
          POSTGRES_USER: gwertable
          POSTGRES_PASSWORD: gwertable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwertable -d gwertable_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gwertable:gwertable@localhost:5432/gwertable_test?schema=public
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd ~/gwertable
            upsert_env() {
              key="$1"
              value="$2"
              touch .env
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env() {
              key="$1"
              value="$2"
              touch .env
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            upsert_env BACKEND_IMAGE "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            ensure_env FRONTEND_IMAGE "${{ env.REGISTRY }}/${{ github.repository_owner }}/gwertable-frontend:latest"

            cat > docker-compose.yml <<'COMPOSE'
            services:
              db:
                image: postgres:17
                restart: unless-stopped
                volumes:
                  - pgdata:/var/lib/postgresql/data
                environment:
                  POSTGRES_DB: gwertable
                  POSTGRES_USER: gwertable
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U gwertable"]
                  interval: 5s
                  timeout: 3s
                  retries: 10

              backend:
                image: ${BACKEND_IMAGE}
                restart: unless-stopped
                depends_on:
                  db:
                    condition: service_healthy
                environment:
                  NODE_ENV: production
                  DATABASE_URL: postgresql://gwertable:${POSTGRES_PASSWORD}@db:5432/gwertable
                  PORT: 4000
                  HOST: 0.0.0.0
                  CORS_ORIGIN: ${FRONTEND_URL}
                  FRONTEND_URL: ${FRONTEND_URL}
                  AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-15}
                  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
                expose:
                  - "4000"
                volumes:
                  - uploads:/app/uploads

              frontend:
                image: ${FRONTEND_IMAGE}
                restart: unless-stopped
                depends_on:
                  - backend
                environment:
                  NODE_ENV: production
                  BACKEND_API_URL: http://backend:4000
                  NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
                ports:
                  - "127.0.0.1:3000:3000"

            volumes:
              pgdata:
              uploads:
            COMPOSE

            docker compose up -d db
            docker compose pull backend frontend
            docker compose run --rm backend npx prisma migrate deploy
            for attempt in 1 2 3; do
              if docker compose up -d --force-recreate --remove-orphans backend frontend; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              docker compose ps -a
              sleep 15
            done
            docker image prune -f
